<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Report Hub</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<script>
/* ============ CONFIGURE THESE 3 VALUES ============ */
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL";      // https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY";    // Project Settings -> API -> anon public
const GROUP_PASSCODE = "change-me";                 // shared with your 14 members
/* ================================================== */
</script>

<!-- Passcode gate -->
<div id="gate" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-3 shadow-xl">
    <h1 class="text-lg font-bold">Group Report Hub</h1>
    <p class="text-sm text-slate-500">Enter the group passcode to continue.</p>
    <input id="pass" type="password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Passcode">
    <input id="who" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Your name">
    <button id="enter" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2 text-sm">Enter</button>
    <p id="gate-err" class="text-xs text-rose-600 hidden">Wrong passcode or missing name.</p>
  </div>
</div>

<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div>
      <h1 class="font-bold text-slate-900">Group Report Hub</h1>
      <p class="text-[11px] text-slate-500"><span id="live-dot" class="inline-block w-2 h-2 rounded-full bg-amber-400 mr-1"></span><span id="live-text">Connecting…</span> · <span id="me"></span></p>
    </div>
    <button id="zip" class="px-3 py-1.5 text-sm font-semibold rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-300 hover:bg-emerald-100">Download all (.zip)</button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-5">
  <section class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
    <div class="flex items-baseline gap-3"><span id="pct" class="text-3xl font-extrabold">0%</span><span class="text-sm text-slate-500"><span id="added">0</span>/14 added to the report · <span id="uploaded">0</span>/14 files uploaded</span></div>
    <div id="bar" class="h-3 bg-slate-100 rounded-full overflow-hidden flex"></div>
  </section>

  <div class="flex flex-wrap gap-2">
    <input id="q" placeholder="Search member, section, topic…" class="flex-1 min-w-[200px] border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white">
    <select id="fs" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white"><option value="all">All statuses</option></select>
  </div>

  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<!-- Edit modal -->
<div id="modal" class="fixed inset-0 bg-slate-900/60 z-40 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-3 max-h-[90vh] overflow-y-auto">
    <h3 id="m-title" class="font-bold"></h3>
    <label class="block text-xs font-semibold">Name<input id="m-name" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-normal"></label>
    <label class="block text-xs font-semibold">Online link (optional)<input id="m-link" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-normal" placeholder="https://docs.google.com/…"></label>
    <label class="block text-xs font-semibold">Reviewer notes<textarea id="m-notes" rows="3" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-normal"></textarea></label>
    <div class="flex justify-end gap-2">
      <button id="m-cancel" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Cancel</button>
      <button id="m-save" class="px-4 py-1.5 text-sm font-semibold bg-indigo-600 text-white rounded-lg">Save</button>
    </div>
  </div>
</div>
<div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg hidden"></div>

<script>
const BUCKET = "submissions";
const STATUS = {
  "not done":["Not done","bg-slate-100 text-slate-700 border-slate-300","bg-slate-300"],
  "submitted":["Submitted","bg-sky-100 text-sky-800 border-sky-300","bg-sky-500"],
  "to be revised":["To be revised","bg-amber-100 text-amber-800 border-amber-300","bg-amber-500"],
  "need another answer":["Need another answer","bg-rose-100 text-rose-800 border-rose-300","bg-rose-500"],
  "finished":["Finished","bg-emerald-100 text-emerald-800 border-emerald-300","bg-emerald-500"],
  "added to the report":["Added to the report","bg-indigo-100 text-indigo-800 border-indigo-300","bg-indigo-600"]
};
const PLAN = {
 1:["Company Background",["1.1 Background of the company","1.2 Vision and mission"]],
 2:["Structure & Relationships",["1.3 Organizational hierarchy","1.4 Strategic partners","1.5 Clientele"]],
 3:["IT Solutions & Business Values",["1.6 IT solutions","2.1.1 Core business values"]],
 4:["Value Creation",["2.1.2 Value creation process"]],
 5:["Technologies in Use",["2.2.1 Technologies in use"]],
 6:["Project Mgmt & Decision Making",["2.2.2 Project management approaches","3.1.2 Decision making process"]],
 7:["IT Projects",["3.1.1 Ongoing and selected IT projects"]],
 8:["IT Engagement Presentation",["3.1.3.1 Problem identification","3.1.3.2 Suggestions","3.1.3.3 Audience"]],
 9:["Corporate Culture & Events",["3.2.1 Corporate culture","3.2.2 Company events"]],
 10:["Selected Event",["3.2.3 Selected event intro","3.2.4 Involvement in organizing"]],
 11:["Challenges & Lessons",["3.2.5 Challenges faced","4. Lessons learnt"]],
 12:["Conclusion & References",["5. Conclusion","6. References"]],
 13:["Appendices (Part 1)",["7.1 Photo evidence: meetings","7.2 Photo evidence: IT engagement"]],
 14:["Appendices (Part 2) & Formatting",["7.3 Photo evidence: non-IT","7.4 Other","Overall format check"]]
};
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kb = b => b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
let sb, rows = [], editing = null, who = "";

function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),3000);}
function fileUrl(p){return sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;}

/* ---------- gate ---------- */
$("enter").onclick = () => {
  const n = $("who").value.trim();
  if ($("pass").value !== GROUP_PASSCODE || !n) { $("gate-err").classList.remove("hidden"); return; }
  localStorage.setItem("hub_auth", JSON.stringify({p:GROUP_PASSCODE,n}));
  start(n);
};
try { const a = JSON.parse(localStorage.getItem("hub_auth")||"null"); if (a && a.p===GROUP_PASSCODE) start(a.n); } catch(e){}

function start(n){
  who = n; $("me").textContent = "Signed in as " + n; $("gate").classList.add("hidden");
  if (SUPABASE_URL.startsWith("PASTE")) { toast("Add your Supabase URL and key in index.html"); $("live-text").textContent="Not configured"; return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  load();
  sb.channel("members-live").on("postgres_changes",{event:"*",schema:"public",table:"members"},load)
    .subscribe(s => { if (s==="SUBSCRIBED") live(true); });
  setInterval(load, 20000);
}
function live(ok){ $("live-dot").className="inline-block w-2 h-2 rounded-full mr-1 "+(ok?"bg-emerald-500":"bg-rose-500"); $("live-text").textContent = ok?"Live – shared by everyone":"Offline"; }

async function load(){
  const {data,error} = await sb.from("members").select("*").order("id");
  if (error) { live(false); toast("Load failed: "+error.message); return; }
  rows = data; live(true); render();
}

/* ---------- render ---------- */
function render(){
  const q = $("q").value.toLowerCase(), f = $("fs").value;
  const counts = {}; Object.keys(STATUS).forEach(k=>counts[k]=0);
  rows.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);
  const added = counts["added to the report"], fin = counts["finished"];
  $("pct").textContent = Math.round((added+fin*0.7)/14*100)+"%";
  $("added").textContent = added;
  $("uploaded").textContent = rows.filter(r=>r.file_path||r.doc_link).length;
  $("bar").innerHTML = Object.keys(STATUS).reverse().map(k=>`<div class="${STATUS[k][2]} h-full" style="width:${counts[k]/14*100}%" title="${STATUS[k][0]}"></div>`).join("");

  const list = rows.filter(r=>{
    const p = PLAN[r.id]; if(!p) return false;
    if (f!=="all" && r.status!==f) return false;
    return !q || (r.name+p[0]+p[1].join(" ")+r.notes).toLowerCase().includes(q);
  });
  $("grid").innerHTML = list.map(r=>{
    const [title,secs] = PLAN[r.id];
    const has = r.file_path || r.doc_link;
    const opts = Object.keys(STATUS).map(k=>`<option value="${k}" ${r.status===k?"selected":""}>${STATUS[k][0]}</option>`).join("");
    return `<div class="bg-white rounded-2xl border border-slate-200 hover:border-indigo-300 transition flex flex-col">
      <div class="p-4 border-b border-slate-100 flex justify-between gap-2">
        <div><span class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 rounded px-2 py-0.5">Member ${String(r.id).padStart(2,"0")}</span>
          <h3 class="font-bold text-sm mt-1.5">${esc(title)}</h3><p class="text-xs text-slate-500">${esc(r.name)}</p></div>
        <button onclick="openEdit(${r.id})" class="text-slate-400 hover:text-indigo-600 text-xs h-fit">Edit</button>
      </div>
      <div class="p-4 space-y-3 flex-1 text-xs">
        <ul class="space-y-0.5">${secs.map(s=>`<li class="text-slate-700"><span class="text-indigo-500 font-bold mr-1">•</span>${esc(s)}</li>`).join("")}</ul>
        ${r.notes?`<div class="bg-amber-50 border border-amber-200 rounded-lg p-2 text-amber-900"><b>Notes:</b> ${esc(r.notes)}</div>`:""}
        ${r.file_path?`<div class="flex items-center justify-between gap-2 bg-emerald-50 border border-emerald-200 rounded-lg p-2">
            <div class="truncate"><div class="font-semibold truncate">${esc(r.file_name)}</div><div class="text-[10px] text-emerald-700">${kb(r.file_size)}</div></div>
            <a href="${fileUrl(r.file_path)}" download="${esc(r.file_name)}" target="_blank" class="px-2 py-1 bg-emerald-600 text-white rounded font-semibold">Download</a></div>`:""}
        ${r.doc_link?`<a href="${esc(r.doc_link)}" target="_blank" rel="noopener" class="block truncate text-indigo-600 underline">${esc(r.doc_link)}</a>`:""}
        ${!has?`<div class="text-slate-400 italic border border-dashed border-slate-300 rounded-lg p-2">No document yet</div>`:""}
      </div>
      <div class="p-3 bg-slate-50 border-t border-slate-100 flex gap-2 items-center">
        <select onchange="setStatus(${r.id},this.value)" class="flex-1 text-xs font-semibold rounded-lg border px-2 py-1.5 ${STATUS[r.status]?.[1]||STATUS["not done"][1]}">${opts}</select>
        <label class="px-2.5 py-1.5 text-xs font-medium bg-white border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">Upload
          <input type="file" class="hidden" onchange="upload(${r.id},this.files[0]);this.value=''"></label>
      </div>
    </div>`;
  }).join("") || `<p class="text-sm text-slate-500">No matches.</p>`;
}

/* ---------- actions ---------- */
async function patch(id, fields){
  const {error} = await sb.from("members").update({...fields, updated_at:new Date().toISOString()}).eq("id",id);
  if (error) { toast("Save failed: "+error.message); return false; }
  const r = rows.find(x=>x.id===id); Object.assign(r,fields); render(); return true;
}
function setStatus(id,s){ patch(id,{status:s}).then(ok=>ok&&toast("Status updated")); }

async function upload(id,file){
  if(!file) return;
  if(file.size > 50*1024*1024){ toast("File too large (50 MB max on the free plan)"); return; }
  toast("Uploading "+file.name+"…");
  const safe = file.name.replace(/[^\w.\-]+/g,"_");
  const path = `member_${id}/${Date.now()}_${safe}`;
  const {error} = await sb.storage.from(BUCKET).upload(path,file,{upsert:false});
  if (error) { toast("Upload failed: "+error.message); return; }
  const old = rows.find(r=>r.id===id).file_path;
  const f = {file_path:path,file_name:file.name,file_size:file.size};
  if (rows.find(r=>r.id===id).status==="not done") f.status="submitted";
  if (await patch(id,f)) { if(old) sb.storage.from(BUCKET).remove([old]); toast("Uploaded: "+file.name); }
}

function openEdit(id){
  editing = id; const r = rows.find(x=>x.id===id);
  $("m-title").textContent = `Member ${id}: ${PLAN[id][0]}`;
  $("m-name").value = r.name||""; $("m-link").value = r.doc_link||""; $("m-notes").value = r.notes||"";
  $("modal").classList.replace("hidden","flex");
}
const closeModal = () => $("modal").classList.replace("flex","hidden");
$("m-cancel").onclick = closeModal;
$("m-save").onclick = async () => {
  const ok = await patch(editing,{name:$("m-name").value.trim()||`Member ${editing}`,doc_link:$("m-link").value.trim(),notes:$("m-notes").value.trim()});
  if(ok){ closeModal(); toast("Saved"); }
};

$("zip").onclick = async () => {
  const withFiles = rows.filter(r=>r.file_path);
  if(!withFiles.length){ toast("No files uploaded yet"); return; }
  if(!window.JSZip){
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  }
  toast("Packaging…");
  const zip = new JSZip();
  for(const r of withFiles){
    const {data} = await sb.storage.from(BUCKET).download(r.file_path);
    if(data) zip.file(`M${String(r.id).padStart(2,"0")}_${r.file_name}`, data);
  }
  const blob = await zip.generateAsync({type:"blob"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `Group_Report_${new Date().toISOString().slice(0,10)}.zip`; a.click();
};

$("q").oninput = render; $("fs").onchange = render;
Object.keys(STATUS).forEach(k=>$("fs").insertAdjacentHTML("beforeend",`<option value="${k}">${STATUS[k][0]}</option>`));
</script>
</body>
</html>
